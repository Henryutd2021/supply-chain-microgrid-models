[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sc-microgrid"
version = "1.0.0"
description = "Facility, warehouse and microgrid location-allocation for supply chains with transactive energy, and virtual power plant scheduling (framework of Li et al., AMM 2023 and SEGRE 2023, and Li, M.S. thesis 2021)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Honglin Li"}]
requires-python = ">=3.10"
# Lower bounds = oldest versions the test suite was run with (and passed); newest tested: see environment.yml
dependencies = ["numpy>=1.26", "pandas>=2.2", "pyomo>=6.9.2", "highspy>=1.7.2"]
keywords = ["facility location", "supply chain", "microgrid", "transactive energy", "virtual power plant", "mixed-integer programming"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
gurobi = ["gurobipy"]
test = ["pytest"]

[project.scripts]
sc-microgrid = "sc_microgrid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
