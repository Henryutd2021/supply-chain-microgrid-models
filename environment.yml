# conda env create -f environment.yml && conda activate sc-microgrid && pip install -e .
# Pinned to the versions the tests were run with (Python 3.12).
name: sc-microgrid
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - numpy==2.5.4
      - pandas==3.1.0
      - pyomo==6.10.1
      - highspy==1.15.1
      - pytest==9.2.0
      # optional, for the direct bilinear two-tier solve and large instances (needs a licence):
      # - gurobipy
